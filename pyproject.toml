[project]
name = "shadowtrace"
version = "0.1.0"
description = "Personal Shadow Tracing & Model Recommender — local-first LLM usage capture, clustering, shadow replay, and model recommendations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "click>=8.1",
    "watchdog>=5.0",
    "duckdb>=1.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.1",
    "hdbscan>=0.8.38",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.12",
    "types-PyYAML",
]

[project.scripts]
shadow = "shadowtrace.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shadowtrace*"]

[tool.setuptools.package-data]
shadowtrace = ["db/*.sql", "replay/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
    "e2e: end-to-end scenario tests (slower, exercise multiple components together)",
]

[tool.coverage.run]
source = ["shadowtrace"]

[tool.coverage.report]
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["dashboard/web/"]
