name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format check)
        run: ruff format --check .

      - name: mypy
        run: mypy shadowtrace

      - name: pytest (unit + integration, coverage gate)
        run: pytest -m "not e2e and not perf" --cov --cov-report=term-missing

      - name: pytest (e2e)
        run: pytest -m e2e

      - name: pytest (perf budgets)
        run: pytest -m perf
